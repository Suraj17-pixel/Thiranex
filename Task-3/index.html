<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster — Modern JavaScript To-Do Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-background">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
  </div>

  <div class="app-wrapper">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-main">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              <circle cx="12" cy="12" r="4"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">TaskMaster</h1>
            <p class="brand-date" id="currentDateDisplay">Loading date...</p>
          </div>
        </div>

        <div class="header-actions">
          <!-- Theme Toggle -->
          <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme" aria-label="Toggle theme">
            <span class="theme-icon light-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
            </span>
            <span class="theme-icon dark-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </span>
          </button>
        </div>
      </div>

      <!-- Overall Progress Card -->
      <section class="progress-card">
        <div class="progress-info">
          <div>
            <span class="progress-label">Productivity Status</span>
            <h2 class="progress-headline" id="progressSummaryText">0 of 0 tasks completed</h2>
          </div>
          <div class="progress-percentage-badge" id="progressPercentage">0%</div>
        </div>
        <div class="progress-bar-track" id="progressBarTrack" role="progressbar" aria-label="Task completion progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-bar-fill" id="progressBarFill" style="width: 0%"></div>
        </div>
      </section>
    </header>

    <!-- Main Container -->
    <main class="app-main">
      <!-- Create Task Card (C in CRUD) -->
      <section class="card input-card">
        <form id="taskForm" autocomplete="off">
          <div class="input-row-primary">
            <div class="input-field-group">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
              </svg>
              <input 
                type="text" 
                id="taskTitleInput" 
                placeholder="What needs to be accomplished today?..." 
                maxlength="140"
                required
                aria-label="New task title"
              />
            </div>
            <button type="submit" class="btn btn-primary" id="addTaskBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              <span>Add Task</span>
            </button>
          </div>

          <!-- Metadata Options: Priority, Category, Due Date -->
          <div class="input-row-secondary">
            <div class="pill-select-wrapper">
              <label for="taskPrioritySelect">Priority:</label>
              <select id="taskPrioritySelect" class="styled-select priority-select">
                <option value="medium">Medium Priority</option>
                <option value="high">High Priority</option>
                <option value="low">Low Priority</option>
              </select>
            </div>

            <div class="pill-select-wrapper">
              <label for="taskCategorySelect">Category:</label>
              <select id="taskCategorySelect" class="styled-select">
                <option value="General">📌 General</option>
                <option value="Work">💼 Work</option>
                <option value="Personal">🏡 Personal</option>
                <option value="Study">📚 Study</option>
                <option value="Health">💪 Health</option>
              </select>
            </div>

            <div class="pill-select-wrapper">
              <label for="taskDueDateInput">Due Date:</label>
              <input type="date" id="taskDueDateInput" class="styled-date-input" />
            </div>
          </div>
        </form>
      </section>

      <!-- Search & Filters Toolbar -->
      <section class="toolbar-section">
        <!-- Search bar -->
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search tasks by keyword or category..." 
            aria-label="Search tasks"
          />
          <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" aria-label="Clear search" hidden>
            &times;
          </button>
        </div>

        <div class="filters-row">
          <!-- Status Filter Tabs -->
          <div class="filter-tabs" role="group" aria-label="Task Status Filters">
            <button type="button" class="filter-tab active" data-filter="all" aria-pressed="true">
              All <span class="tab-badge" id="countAll">0</span>
            </button>
            <button type="button" class="filter-tab" data-filter="active" aria-pressed="false">
              Active <span class="tab-badge" id="countActive">0</span>
            </button>
            <button type="button" class="filter-tab" data-filter="completed" aria-pressed="false">
              Completed <span class="tab-badge" id="countCompleted">0</span>
            </button>
          </div>

          <!-- Secondary Filters: Priority & Sorting -->
          <div class="sort-filter-controls">
            <div class="inline-select-group">
              <label for="filterPrioritySelect">Priority:</label>
              <select id="filterPrioritySelect" class="control-select">
                <option value="all">All Priorities</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>

            <div class="inline-select-group">
              <label for="sortSelect">Sort By:</label>
              <select id="sortSelect" class="control-select">
                <option value="created-desc">Newest First</option>
                <option value="created-asc">Oldest First</option>
                <option value="due-date">Due Date</option>
                <option value="priority">Priority</option>
                <option value="alphabetical">Alphabetical (A-Z)</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <!-- Task List Container (Read, Update, Delete with Delegated Events) -->
      <section class="task-list-section card">
        <div class="task-list-header">
          <div class="task-list-title-group">
            <h3 id="currentViewTitle">All Tasks</h3>
            <span class="active-filter-indicator" id="filterStatusIndicator">Showing all items</span>
          </div>
          <div class="task-list-quick-actions">
            <button id="markAllCompleteBtn" class="btn-text-subtle" title="Mark all filtered tasks as completed">
              Mark all complete
            </button>
            <button id="clearCompletedBtn" class="btn-text-subtle text-danger" title="Delete all completed tasks">
              Clear completed
            </button>
          </div>
        </div>

        <!-- Dynamic Task List Element -->
        <ul id="taskList" class="task-list" aria-live="polite">
          <!-- Dynamically injected via JavaScript -->
        </ul>

        <!-- Empty State Message -->
        <div id="emptyState" class="empty-state" role="status" hidden>
          <div class="empty-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
          </div>
          <h4 id="emptyStateTitle" class="empty-title">All caught up!</h4>
          <p id="emptyStateMessage" class="empty-desc">You don't have any pending tasks right now. Create a new task above to get started.</p>
        </div>
      </section>

      <!-- Action Footer: Stats, Backup / Restore, Quick Reset -->
      <footer class="app-footer">
        <div class="footer-stats">
          <span id="itemsLeftCount" class="highlight-count">0 items remaining</span>
          <span class="separator">•</span>
          <span class="storage-info">
            <svg class="storage-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <ellipse cx="12" cy="5" rx="9" ry="3"/>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
            </svg>
            Auto-persisted via <code>localStorage</code>
          </span>
        </div>

        <div class="footer-tools">
          <button id="exportDataBtn" class="btn-tool" title="Export tasks to JSON file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>Export JSON</span>
          </button>

          <label class="btn-tool" title="Import tasks from JSON file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span>Import JSON</span>
            <input type="file" id="importFileInput" class="visually-hidden" accept=".json" />
          </label>

          <button id="resetDemoBtn" class="btn-tool" title="Load sample demo tasks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 0115.54-6.36L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 01-15.54 6.36L3 16"/>
              <path d="M3 21v-5h5"/>
            </svg>
            <span>Load Demo Tasks</span>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
